# Japan - everything the matchday run needs besides the CSV files.
name: Japan
season: 2026-27                 # results with this season label form the current tables

results: results.csv
initial_elo: initial_elo.csv

# Map alternative spellings to the canonical team name (applied to every file).
aliases: {}

elo:
  lookup_step: 10               # Elo-diff resolution of the ClubElo goal-weight tables
  expg_lookup_step: 5           # Elo-diff resolution of the expected-goals lookup
  default_k: 30
  # How the ClubElo goal weights turn an Elo edge into Poisson goal rates:
  #   win_prob        Poisson P(win) = Elo expected score (original scripts; counts draws twice)
  #   expected_score  Poisson P(win) + P(draw)/2 = Elo expected score
  lambda_match: expected_score

# HFA / draw rate / goals per game used to price fixtures (Elo updates are unaffected):
#   history  all seasons equally
#   shrink   this season blended with earlier seasons, which count as `prior_matches` matches
prediction_params:
  method: history
  prior_matches: 300           # backtest: 300-600 helped slightly, 50-150 hurt
  # league_rate  Davidson draw parameter = league draw rate (original; under-predicts draws)
  # calibrated   fitted per league so the average predicted draw rate over the league's
  #              real matchups equals the observed rate (backtest: -0.07% log loss)
  draw_model: calibrated

# Cup pricing parameters (HFA, level-teams draw rate, goals/game):
#   first_round  raw values from the first remaining round's label (original)
#   anchored     Elo-adjusted maximum-likelihood fit for each cup's early and late rounds
#                (labels listed under each cup), blended with the league anchor, which
#                counts as `anchor_matches` matches. A cup's `predict:` values still override.
cup_params:
  method: anchored
  anchor: [J1 League, J2 League, J3 League]
  anchor_matches: 300

# Cup shoot-outs: coin = 50/50, skill = per-team conversion rates from penalties.csv
penalties:
  method: skill
  file: penalties.csv
  prior_kicks: 70               # shrinkage for teams with scored/missed but no `skill` value
  default_skill: 0.77           # teams not in the file

# Elo update settings per tournament label used in results.csv.
# hfa: auto  -> 400*log10(home wins / away wins) over all history, recomputed every run.
# A number fixes it (0 for neutral venues).
tournaments:
  J1 League:            {k: 30, hfa: auto}
  J2 League:            {k: 30, hfa: auto}
  J3 League:            {k: 30, hfa: auto}
  JFL:                  {k: 30, hfa: auto}
  J1/J2:                {k: 30, hfa: 27.15}   # promotion/relegation playoffs: too few matches
  J2/J3:                {k: 30, hfa: 32.55}
  J3/JFL:               {k: 30, hfa: 28.5}
  JFL/JRL:              {k: 30, hfa: 16.45}
  Emperor Cup:          {k: 20, hfa: auto}
  Emperor Cup R16:      {k: 30, hfa: 0}
  Emperor Cup QF:       {k: 30, hfa: auto}
  Emperor Cup SF:       {k: 30, hfa: auto}
  Emperor Cup Final:    {k: 40, hfa: 0}       # neutral venue
  League Cup:           {k: 20, hfa: auto}
  League Cup PO:        {k: 30, hfa: auto}
  League Cup QF:        {k: 30, hfa: auto}
  League Cup SF:        {k: 30, hfa: auto}
  League Cup Final:     {k: 40, hfa: 0}       # neutral venue
  Super Cup:            {k: 40, hfa: 0}       # neutral venue
  J1 100 Year Vision:   {k: 30, hfa: auto}
  J2/3 100 Year Vision: {k: 30, hfa: auto}

margins:
  three_way: 1.08               # 1X2
  two_way: 1.08                 # over/under 2.5
  outright: 1.08                # yes/no outright markets

simulation:
  n_sims: 20000
  seed: 2026                    # fixed seed = reproducible output; remove for fresh randomness

# League fixtures: enter scores straight into the hg/ag columns (hg_90/ag_90 only if
# extra time was played). Prediction parameters (hfa, draw_rate, total_goals) are
# computed from the league's history unless overridden under `predict:`.
# Markets: [first, last] finishing positions; negative numbers count from the bottom.
leagues:
  j1:
    name: J1 League
    tournament: J1 League
    fixtures: fixtures/j1_2026-27.csv
    markets:
      Winner: [1, 1]
      Top 3: [1, 3]
      Relegation: [-3, -1]
  j2:
    name: J2 League
    tournament: J2 League
    fixtures: fixtures/j2_2026-27.csv
    markets:
      Winner: [1, 1]
      Top 2: [1, 2]
      Top 6: [1, 6]
      Relegation: [-3, -1]
  j3:
    name: J3 League
    tournament: J3 League
    fixtures: fixtures/j3_2026-27.csv
    markets:
      Winner: [1, 1]
      Top 2: [1, 2]
      Top 6: [1, 6]
      Bottom 2: [-2, -1]
  jfl:
    name: JFL
    tournament: JFL
    fixtures: fixtures/jfl_2026-27.csv
    markets:
      Winner: [1, 1]
      Top 4: [1, 4]
      Bottom 2: [-2, -1]

# Cups: list the remaining rounds from the current one to the final.
# The draw file is filled in as draws are announced; until then the sim draws at random.
cups:
  emperors_cup:
    name: Emperor's Cup
    results_prefix: Emperor Cup   # tournament labels belonging to this cup
    draw: cups/emperors_cup_2026-27.csv
    # predict: {hfa: 53.2, draw_rate: 0.255, total_goals: 2.627}   # fixed values (override cup_params)
    early: [Emperor Cup]
    late: [Emperor Cup R16, Emperor Cup QF, Emperor Cup SF]
    rounds:
      - {name: R16, tournament: Emperor Cup R16, legs: 1}
      - {name: QF, tournament: Emperor Cup QF, legs: 1}
      - {name: SF, tournament: Emperor Cup SF, legs: 1}
      - {name: Final, tournament: Emperor Cup Final, legs: 1, neutral: true}
  league_cup:
    name: League Cup
    results_prefix: League Cup
    draw: cups/league_cup_2026-27.csv
    # predict: {hfa: 61.6, draw_rate: 0.267, total_goals: 2.88}    # fixed values (override cup_params)
    early: [League Cup]
    late: [League Cup PO, League Cup QF, League Cup SF]
    rounds:
      - {name: PO, tournament: League Cup PO, legs: 2}
      - {name: QF, tournament: League Cup QF, legs: 2,
         entrants: [Machida Zelvia, Kashiwa Reysol, Kashima Antlers, Vissel Kobe]}   # seeded AFC clubs
      - {name: SF, tournament: League Cup SF, legs: 2}
      - {name: Final, tournament: League Cup Final, legs: 1, neutral: true}
